name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests
      - name: Install Lean via elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean examples/Compose.lean
      - run: lean lean/TMN.lean
      - run: lean lean/Dependent.lean
      - run: lean lean/Scoped.lean
      - name: Compile semantic adapter
        run: |
          printf 'import Lean\n' > "$RUNNER_TEMP/LeanDuetAdapter.lean"
          cat lean/Extract.lean lean/InfoTreeTrace.lean tests/ir_decoder_cases.lean >> "$RUNNER_TEMP/LeanDuetAdapter.lean"
          lean "$RUNNER_TEMP/LeanDuetAdapter.lean"
      - run: python tests/semantic_integration.py
      - run: python tests/search_integration.py
      - run: python tests/lsp_integration.py
      - run: python tests/interpret_integration.py
      - run: python tests/ir_integration.py
      - name: Disable unrelated Microsoft apt feed
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/static_browser.py
      - run: python scripts/build_demo_trees.py
      - run: python tests/static_browser.py
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: browser-smoke.png
          if-no-files-found: ignore
